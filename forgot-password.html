<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:linear-gradient(160deg,#e8f4f8 0%,#eef7f4 48%,#e6f1fb 100%);background-attachment:fixed;color:#101828;min-height:100vh;display:flex;flex-direction:column;}
a{color:#2563eb;text-decoration:none;}
nav{height:64px;background:#fff;border-bottom:1px solid #eaecf0;display:flex;align-items:center;justify-content:space-between;padding:0 48px;}
.logo{font-size:1.25rem;font-weight:800;letter-spacing:-0.03em;color:#101828;}
.logo span{color:#2563eb;}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px;}
.card{background:#fff;border:1px solid #d9e6ee;border-radius:16px;padding:36px;width:100%;max-width:420px;box-shadow:0 1px 2px rgba(15,23,42,0.04),0 14px 34px -18px rgba(37,99,235,0.28);}
.card-icon{font-size:2rem;margin-bottom:16px;text-align:center;}
h1{font-size:1.4rem;font-weight:800;letter-spacing:-0.02em;margin-bottom:6px;text-align:center;}
.sub{font-size:0.82rem;color:#667085;text-align:center;margin-bottom:28px;line-height:1.6;}
.field{margin-bottom:16px;}
label{display:block;font-size:0.78rem;font-weight:600;color:#344054;margin-bottom:6px;}
input{width:100%;padding:11px 14px;border:1.5px solid #d0d5dd;border-radius:8px;font-family:'Plus Jakarta Sans',sans-serif;font-size:0.88rem;color:#101828;outline:none;transition:border-color .15s;}
input:focus{border-color:#2563eb;}
.btn{width:100%;padding:13px;background:linear-gradient(135deg,#3b82f6 0%,#2563eb 45%,#1e40af 100%);background-size:160% 160%;background-position:0% 50%;color:#fff;box-shadow:0 6px 18px rgba(37,99,235,0.32);border:none;border-radius:9px;font-family:'Plus Jakarta Sans',sans-serif;font-size:0.9rem;font-weight:700;cursor:pointer;transition:all .2s;margin-top:4px;}
.btn:hover:not(:disabled){background-position:100% 50%;transform:translateY(-1px);box-shadow:0 8px 22px rgba(37,99,235,0.4);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.divider{text-align:center;font-size:0.78rem;color:#98a2b3;margin:16px 0;}
.link-btn{width:100%;padding:11px;background:#fff;color:#2563eb;border:1.5px solid #2563eb;border-radius:9px;font-family:'Plus Jakarta Sans',sans-serif;font-size:0.88rem;font-weight:600;cursor:pointer;transition:all .2s;text-align:center;display:block;}
.link-btn:hover{background:#eff6ff;border-color:#1d4ed8;color:#1d4ed8;}
.status{margin-top:14px;font-size:0.78rem;text-align:center;min-height:18px;}
.status.err{color:#b42318;}
.status.ok{color:#027a48;font-weight:600;}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}
footer{padding:18px 48px;border-top:1px solid #eaecf0;background:#fff;display:flex;align-items:center;justify-content:space-between;}
.f-logo{font-size:0.9rem;font-weight:800;color:#101828;}
.f-logo span{color:#2563eb;}
.f-copy{font-size:0.7rem;color:#98a2b3;}
nav{height:64px;position:relative;justify-content:space-between;padding:0 48px;border-bottom:1px solid #eaecf0;}
.nav-c{display:flex;gap:18px;align-items:center;}
.nav-c a{font-size:0.875rem;font-weight:700;color:#101828;transition:color .15s;}
.nav-c a:hover{color:#2563eb;}
.nav-c .btn-blue{padding:9px 18px;border-radius:8px;font-size:0.85rem;font-weight:700;background:linear-gradient(135deg,#3b82f6 0%,#2563eb 45%,#1e40af 100%);color:#fff;}
.nav-c .btn-blue:hover{color:#fff;}
.hamburger{display:none;background:none;border:none;cursor:pointer;padding:6px;width:38px;height:38px;flex-direction:column;justify-content:center;align-items:center;gap:5px;}
.hamburger span{display:block;width:22px;height:2px;background:#101828;border-radius:2px;transition:all .2s;}
.hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg);}
.hamburger.open span:nth-child(2){opacity:0;}
.hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}
@media(max-width:640px){
  nav{padding:0 20px;}
  .hamburger{display:flex;}
  .nav-c{display:none;position:absolute;top:100%;left:0;right:0;z-index:500;background:#fff;flex-direction:column;align-items:stretch;gap:0;padding:8px 20px 16px;border-bottom:1px solid #eaecf0;box-shadow:0 12px 24px rgba(16,24,40,0.08);}
  .nav-c.open{display:flex;}
  .nav-c a{padding:12px 4px;border-bottom:1px solid #eaecf0;}
  .nav-c a.btn-blue{border-bottom:none;text-align:center;margin-top:10px;}
}
nav{z-index:500;}
nav{position:sticky!important;top:0;z-index:500!important;}
/* PF-PROTECT: no text selection / image dragging; typing fields stay normal */
body{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none;}
input,textarea,select{-webkit-user-select:text;-moz-user-select:text;-ms-user-select:text;user-select:text;}
img{-webkit-user-drag:none;user-drag:none;}
</style>

<body>
<nav>
  <a href="/" class="logo" style="display:flex;align-items:center;gap:0;"><img src="/images/logo.png" alt="PlagiFix logo" style="width:42px;height:42px;border-radius:11px;"/>Plagi<span>Fix</span></a>
  <button class="hamburger" id="hamburger" aria-label="Menu" onclick="document.getElementById('hamburger').classList.toggle('open');document.getElementById('nav-c').classList.toggle('open');">
    <span></span><span></span><span></span>
  </button>
  <div class="nav-c" id="nav-c">
    <a href="/">Home</a>
    <a href="/ai-plag-score.html#ai-plagfix">AI & Plag Fix</a>
    <a href="/ai-plag-score.html#ai-plag-score">AI & Plag Score</a>
    <a href="/pricing.html">Pricing</a>
    <a href="/faq.html">FAQ</a>
    <a href="/login.html" class="btn-blue">Sign in</a>
  </div>
</nav>
<main>
  <div class="card">
    <div class="card-icon">🔑</div>
    <h1>Reset your password</h1>
    <p class="sub">Enter your email and we'll send you a link to reset your password.</p>
    <div class="field">
      <label>Email address</label>
      <input type="email" id="email" placeholder="you@university.edu" onkeydown="if(event.key==='Enter')sendReset()"/>
    </div>
    <button class="btn" id="reset-btn" onclick="sendReset()">Send reset link</button>
    <div class="status" id="status"></div>
    <div class="divider">Remembered your password?</div>
    <a href="/login.html" class="link-btn">Back to sign in</a>
  </div>
</main>
<footer>
  <div class="f-logo">Plagi<span>Fix</span></div>
  <div class="f-copy">© 2025 PlagiFix</div>
</footer>
<script>
const SUPABASE_URL = 'https://wrypnctfcwijglyivthg.supabase.co';
const SUPABASE_KEY = 'sb_publishable_I7NR_6S40Ydjyw44Ic26pw_I5-XUrTr';

async function sendReset() {
  const email = document.getElementById('email').value.trim().toLowerCase();
  const statusEl = document.getElementById('status');
  const btn = document.getElementById('reset-btn');

  if (!email) {
    statusEl.textContent = 'Please enter your email address.';
    statusEl.className = 'status err'; return;
  }

  btn.innerHTML = '<span class="spin"></span> Sending...';
  btn.disabled = true;

  try {
    const redirectTo = encodeURIComponent('https://plagifix.com/reset-password.html');
    const r = await fetch(`${SUPABASE_URL}/auth/v1/recover?redirect_to=${redirectTo}`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'apikey': SUPABASE_KEY},
      body: JSON.stringify({email})
    });

    // Same message for registered and unknown emails (stops email enumeration).
    // But a real error (too many requests, send failure) must not look like success.
    if (!r.ok) {
      statusEl.textContent = r.status === 429
        ? 'Too many requests. Please wait a minute and try again.'
        : 'We could not send the email right now. Please try again shortly.';
      statusEl.className = 'status err';
      btn.innerHTML = 'Send reset link';
      btn.disabled = false;
      return;
    }
    statusEl.textContent = '✓ If an account exists for that email, a reset link has been sent. Check your inbox.';
    statusEl.className = 'status ok';
    btn.innerHTML = 'Send reset link';
    btn.disabled = false;
  } catch(err) {
    statusEl.textContent = 'Something went wrong. Please try again.';
    statusEl.className = 'status err';
    btn.innerHTML = 'Send reset link';
    btn.disabled = false;
  }
}
</script>
<script>
/* PF-PROTECT: right-click, copy, cut and drag are blocked (typing fields excepted) */
(function () {
  function inField(e) {
    var t = e.target;
    return t && t.closest && t.closest('input, textarea, select, [contenteditable="true"]');
  }
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  ['copy', 'cut', 'dragstart', 'selectstart'].forEach(function (name) {
    document.addEventListener(name, function (e) { if (!inField(e)) e.preventDefault(); });
  });
})();
</script>
