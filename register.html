<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PlagiFix — Create Account</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232563eb'/><text x='16' y='23' text-anchor='middle' font-family='Georgia,serif' font-size='20' font-weight='bold' fill='white'>P</text></svg>"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#f7f8fa;color:#101828;min-height:100vh;display:flex;flex-direction:column;}
a{color:#2563eb;text-decoration:none;}
nav{height:64px;background:#fff;border-bottom:1px solid #eaecf0;display:flex;align-items:center;justify-content:space-between;padding:0 48px;}
.logo{font-size:1.25rem;font-weight:800;letter-spacing:-0.03em;color:#101828;}
.logo span{color:#2563eb;}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px;}
.card{background:#fff;border:1px solid #eaecf0;border-radius:16px;padding:36px;width:100%;max-width:420px;box-shadow:0 1px 3px rgba(16,24,40,0.06);}
.card-icon{font-size:2rem;margin-bottom:16px;text-align:center;}
h1{font-size:1.4rem;font-weight:800;letter-spacing:-0.02em;margin-bottom:6px;text-align:center;}
.sub{font-size:0.82rem;color:#667085;text-align:center;margin-bottom:28px;line-height:1.6;}
.field{margin-bottom:16px;}
label{display:block;font-size:0.78rem;font-weight:600;color:#344054;margin-bottom:6px;}
input{width:100%;padding:11px 14px;border:1.5px solid #d0d5dd;border-radius:8px;font-family:'Plus Jakarta Sans',sans-serif;font-size:0.88rem;color:#101828;outline:none;transition:border-color .15s;}
input:focus{border-color:#2563eb;}
.btn{width:100%;padding:13px;background:#2563eb;color:#fff;border:none;border-radius:9px;font-family:'Plus Jakarta Sans',sans-serif;font-size:0.9rem;font-weight:700;cursor:pointer;transition:all .2s;margin-top:4px;}
.btn:hover:not(:disabled){background:#1d4ed8;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.divider{text-align:center;font-size:0.78rem;color:#98a2b3;margin:16px 0;}
.link-btn{width:100%;padding:11px;background:#fff;color:#101828;border:1.5px solid #d0d5dd;border-radius:9px;font-family:'Plus Jakarta Sans',sans-serif;font-size:0.88rem;font-weight:600;cursor:pointer;transition:all .2s;text-align:center;display:block;}
.link-btn:hover{border-color:#2563eb;color:#2563eb;}
.status{margin-top:14px;font-size:0.78rem;text-align:center;min-height:18px;}
.status.err{color:#b42318;}
.status.ok{color:#027a48;font-weight:600;}
.footer-text{text-align:center;font-size:0.78rem;color:#667085;margin-top:20px;}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}
footer{padding:18px 48px;border-top:1px solid #eaecf0;background:#fff;display:flex;align-items:center;justify-content:space-between;}
.f-logo{font-size:0.9rem;font-weight:800;color:#101828;}
.f-logo span{color:#2563eb;}
.f-copy{font-size:0.7rem;color:#98a2b3;}
</style>
</head>
<body>
<nav><a href="/" class="logo">Plagi<span>Fix</span></a></nav>
<main>
  <div class="card">
    <div class="card-icon">📝</div>
    <h1>Create your account</h1>
    <p class="sub">Sign up to track your credits and process documents.</p>
    <div class="field">
      <label>Full name</label>
      <input type="text" id="name" placeholder="Dr. Priya M."/>
    </div>
    <div class="field">
      <label>Email address</label>
      <input type="email" id="email" placeholder="you@university.edu"/>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="Min. 6 characters"/>
    </div>
    <div class="field">
      <label>Confirm password</label>
      <input type="password" id="confirm" placeholder="Repeat your password" onkeydown="if(event.key==='Enter')register()"/>
    </div>
    <button class="btn" id="reg-btn" onclick="register()">Create account</button>
    <div class="status" id="status"></div>
    <div class="divider">Already have an account?</div>
    <a href="/login.html" class="link-btn">Sign in</a>
  </div>
</main>
<footer>
  <div class="f-logo">Plagi<span>Fix</span></div>
  <div class="f-copy">© 2025 PlagiFix</div>
</footer>
<script>
const SUPABASE_URL = 'https://wrypnctfcwijglyivthg.supabase.co';
const SUPABASE_KEY = 'sb_publishable_I7NR_6S40Ydjyw44Ic26pw_I5-XUrTr';
const BACKEND = 'https://file-processor-3i33.onrender.com';

async function register() {
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim().toLowerCase();
  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirm').value;
  const statusEl = document.getElementById('status');
  const btn = document.getElementById('reg-btn');

  if (!name || !email || !password) {
    statusEl.textContent = 'Please fill in all fields.';
    statusEl.className = 'status err'; return;
  }
  if (password.length < 6) {
    statusEl.textContent = 'Password must be at least 6 characters.';
    statusEl.className = 'status err'; return;
  }
  if (password !== confirm) {
    statusEl.textContent = 'Passwords do not match.';
    statusEl.className = 'status err'; return;
  }

  btn.innerHTML = '<span class="spin"></span> Creating account...';
  btn.disabled = true;

  try {
    // redirect_to tells Supabase where to send the user after they click the
    // confirmation link in their email — straight to the login page, where
    // they'll sign in manually and that sign-in is what grants their free credit.
    const redirectTo = encodeURIComponent('https://plagifix.com/login.html');
    const r = await fetch(`${SUPABASE_URL}/auth/v1/signup?redirect_to=${redirectTo}`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'apikey': SUPABASE_KEY},
      body: JSON.stringify({email, password, data: {full_name: name}})
    });
    const data = await r.json();
    if (data.error) throw new Error(data.error.message || data.msg);

    // With "Confirm email" enabled, Supabase returns 200 + a user object
    // but NO session (access_token is null/undefined) until the user
    // clicks the confirmation link in their inbox. Only treat signup as
    // complete — store a session, grant the free credit, and redirect —
    // once a real access_token is present.
    if (!data.access_token) {
      statusEl.textContent = '✓ Almost done! Check your inbox and click the confirmation link to activate your account.';
      statusEl.className = 'status ok';
      btn.innerHTML = 'Create account';
      btn.disabled = false;
      return;
    }

    // Store session
    localStorage.setItem('pf_token', data.access_token);
    localStorage.setItem('pf_email', email);
    localStorage.setItem('pf_name', name);

    // Give 1 free credit to new user
    await fetch(`${BACKEND}/free-credit`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email})
    });

    statusEl.textContent = '✓ Account created! You have 1 free credit. Redirecting...';
    statusEl.className = 'status ok';
    setTimeout(() => window.location.href = '/dashboard.html', 1500);
  } catch(err) {
    statusEl.textContent = err.message || 'Registration failed. Please try again.';
    statusEl.className = 'status err';
    btn.innerHTML = 'Create account';
    btn.disabled = false;
  }
}
</script>
</body>
</html>
