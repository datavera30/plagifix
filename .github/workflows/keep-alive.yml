name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 6 */3 * *'   # runs every 3 days at 6:00 AM UTC
  workflow_dispatch:         # lets you also trigger it manually anytime from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "https://wrypnctfcwijglyivthg.supabase.co/rest/v1/customers?select=id&limit=1" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY"
