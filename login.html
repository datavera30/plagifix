<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PlagiFix — Sign In</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232563eb'/><text x='16' y='23' text-anchor='middle' font-family='Georgia,serif' font-size='20' font-weight='bold' fill='white'>P</text></svg>"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://openfpcdn.io/fingerprintjs/v4/iife.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#f7f8fa;color:#101828;min-height:100vh;display:flex;flex-direction:column;}
a{color:#2563eb;text-decoration:none;}
nav{height:64px;background:#fff;border-bottom:1px solid #eaecf0;display:flex;align-items:center;justify-content:space-between;padding:0 48px;}
.nav-c{display:flex;gap:18px;align-items:center;}
.nav-c a{font-size:0.875rem;font-weight:700;color:#101828;transition:color .15s;}
.nav-c a:hover{color:#2563eb;}
.nav-c .btn-out{padding:9px 18px;border-radius:8px;font-size:0.85rem;font-weight:700;border:1.5px solid #d0d5dd;color:#101828;}
.nav-c .btn-out:hover{border-color:#2563eb;color:#2563eb;}
.nav-c .btn-blue{padding:9px 18px;border-radius:8px;font-size:0.85rem;font-weight:700;background:#2563eb;color:#fff;}
.nav-c .btn-blue:hover{background:#1d4ed8;}
.logo{font-size:1.75rem;font-weight:800;letter-spacing:-0.03em;color:#101828;}
.logo span{color:#2563eb;}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px;}
.card{background:#fff;border:1px solid #eaecf0;border-radius:16px;padding:36px;width:100%;max-width:420px;box-shadow:0 1px 3px rgba(16,24,40,0.06);}
.card-icon{font-size:2rem;margin-bottom:16px;text-align:center;}
h1{font-size:1.4rem;font-weight:800;letter-spacing:-0.02em;margin-bottom:6px;text-align:center;}
.sub{font-size:0.82rem;color:#667085;text-align:center;margin-bottom:28px;line-height:1.6;}
.field{margin-bottom:16px;}
label{display:block;font-size:0.78rem;font-weight:600;color:#344054;margin-bottom:6px;}
.label-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.label-row label{margin-bottom:0;}
input{width:100%;padding:11px 14px;border:1.5px solid #d0d5dd;border-radius:8px;font-family:'Plus Jakarta Sans',sans-serif;font-size:0.88rem;color:#101828;outline:none;transition:border-color .15s;}
input:focus{border-color:#2563eb;}
.pw-wrap{position:relative;}
.pw-wrap input{padding-right:44px;}
.pw-toggle{position:absolute;right:0;top:0;height:100%;width:40px;display:flex;align-items:center;justify-content:center;background:none;border:none;cursor:pointer;color:#98a2b3;padding:0;}
.pw-toggle:hover{color:#667085;}
.pw-toggle svg{width:18px;height:18px;}
.btn{width:100%;padding:13px;background:#2563eb;color:#fff;border:none;border-radius:9px;font-family:'Plus Jakarta Sans',sans-serif;font-size:0.9rem;font-weight:700;cursor:pointer;transition:all .2s;margin-top:4px;}
.btn:hover:not(:disabled){background:#1d4ed8;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.divider{text-align:center;font-size:0.78rem;color:#98a2b3;margin:16px 0;}
.link-btn{width:100%;padding:11px;background:#fff;color:#101828;border:1.5px solid #d0d5dd;border-radius:9px;font-family:'Plus Jakarta Sans',sans-serif;font-size:0.88rem;font-weight:600;cursor:pointer;transition:all .2s;text-align:center;display:block;}
.link-btn:hover{border-color:#2563eb;color:#2563eb;}
.status{margin-top:14px;font-size:0.78rem;text-align:center;min-height:18px;}
.status.err{color:#b42318;}
.status.ok{color:#027a48;font-weight:600;}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}
footer{padding:18px 48px;border-top:1px solid #eaecf0;background:#fff;display:flex;align-items:center;justify-content:space-between;}
.f-logo{font-size:0.9rem;font-weight:800;color:#101828;}
.f-logo span{color:#2563eb;}
.f-copy{font-size:0.7rem;color:#98a2b3;}
</style>
</head>
<body>
<nav>
  <a href="/" class="logo" style="display:flex;align-items:center;gap:0;"><img src="/images/logo.png" alt="PlagiFix logo" style="width:42px;height:42px;border-radius:11px;"/>Plagi<span>Fix</span></a>
  <div class="nav-c">
    <a href="/">Home</a>
    <a href="/#how">AI & Plag Fix</a>
    <a href="/turnitin-report.html#turnitin-report">Turnitin Report</a>
    <a href="/#pricing">Pricing</a>
    <a href="/#faq">FAQ</a>
    <a href="/register.html" class="btn-blue">Register →</a>
  </div>
</nav>
<main>
  <div class="card">
    <div class="card-icon">👋</div>
    <h1>Welcome back</h1>
    <p class="sub">Sign in to access your credits and process documents.</p>
    <div class="field">
      <label>Email address</label>
      <input type="email" id="email" placeholder="you@university.edu"/>
    </div>
    <div class="field">
      <div class="label-row">
        <label>Password</label>
        <a href="/forgot-password.html" style="font-size:0.75rem;">Forgot password?</a>
      </div>
      <div class="pw-wrap">
        <input type="password" id="password" placeholder="Your password" onkeydown="if(event.key==='Enter')login()"/>
        <button type="button" class="pw-toggle" onclick="togglePw('password', this)" aria-label="Show password">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    <button class="btn" id="login-btn" onclick="login()">Sign in</button>
    <div class="status" id="status"></div>
    <div class="divider">Don't have an account?</div>
    <a href="/register.html" class="link-btn">Create account</a>
  </div>
</main>
<footer>
  <div class="f-logo">Plagi<span>Fix</span></div>
  <div class="f-copy">© 2025 PlagiFix</div>
</footer>
<script>
const SUPABASE_URL = 'https://wrypnctfcwijglyivthg.supabase.co';
const SUPABASE_KEY = 'sb_publishable_I7NR_6S40Ydjyw44Ic26pw_I5-XUrTr';
const BACKEND = 'https://file-processor-3i33.onrender.com';

function togglePw(id, btn) {
  const input = document.getElementById(id);
  const showing = input.type === 'text';
  input.type = showing ? 'password' : 'text';
  const eyeOpen = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/>';
  const eyeOff = '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.6 18.6 0 0 1 4.22-5.36M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
  btn.querySelector('svg').innerHTML = showing ? eyeOpen : eyeOff;
  btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
}

// If already logged in redirect to dashboard
if (localStorage.getItem('pf_token')) {
  window.location.href = '/dashboard.html';
}

// Check if coming from payment
const params = new URLSearchParams(window.location.search);
const paymentId = params.get('payment_id');
const planKey = params.get('plan');
if (paymentId) {
  document.getElementById('status').textContent = '✓ Payment confirmed! Sign in to access your credits.';
  document.getElementById('status').className = 'status ok';
}

async function login() {
  const email = document.getElementById('email').value.trim().toLowerCase();
  const password = document.getElementById('password').value;
  const statusEl = document.getElementById('status');
  const btn = document.getElementById('login-btn');

  if (!email || !password) {
    statusEl.textContent = 'Please enter your email and password.';
    statusEl.className = 'status err'; return;
  }

  btn.innerHTML = '<span class="spin"></span> Signing in...';
  btn.disabled = true;

  try {
    const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'apikey': SUPABASE_KEY},
      body: JSON.stringify({email, password})
    });
    const data = await r.json();
    if (data.error) throw new Error(data.error_description || data.error);

    localStorage.setItem('pf_token', data.access_token);
    localStorage.setItem('pf_email', email);
    localStorage.setItem('pf_name', data.user?.user_metadata?.full_name || email);

    // Grant the one-time free credit here, on first successful sign-in.
    // This is the correct place for it now that email confirmation is
    // required — signup alone no longer produces a usable session, so
    // this is the first real moment a user has one. It's safe to call
    // this on every single login (not just the first): the backend's
    // /free-credit endpoint checks whether this email has ever had any
    // credit row before, and does nothing if so — so a returning user,
    // or someone who tries to sign up again with the same email, will
    // never receive a second free credit no matter how many times this
    // runs.
    //
    // device_id: reuse the fingerprint generated on register.html if it's
    // already in localStorage; otherwise (e.g. someone lands directly on
    // login.html) generate one fresh here so the same abuse checks apply.
    let deviceId = localStorage.getItem('pf_device_id') || '';
    if (!deviceId) {
      try {
        const fp = await FingerprintJS.load();
        const result = await fp.get();
        deviceId = result.visitorId;
        localStorage.setItem('pf_device_id', deviceId);
      } catch (err) { /* fingerprinting unavailable — proceed without it */ }
    }
    fetch(`${BACKEND}/free-credit`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email, device_id: deviceId})
    }).catch(() => {}); // best-effort; don't block sign-in on this

    // If coming from payment, confirm it first
    if (paymentId && planKey) {
      await fetch('https://file-processor-3i33.onrender.com/confirm-payment', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({email, payment_id: paymentId, plan: planKey})
      });
    }

    statusEl.textContent = '✓ Signed in! Redirecting...';
    statusEl.className = 'status ok';
    setTimeout(() => window.location.href = '/dashboard.html', 800);
  } catch(err) {
    statusEl.textContent = err.message || 'Sign in failed. Please check your credentials.';
    statusEl.className = 'status err';
    btn.innerHTML = 'Sign in';
    btn.disabled = false;
  }
}
</script>
</body>
</html>
