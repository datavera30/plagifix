<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PlagiFix — Sign In</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232563eb'/><text x='16' y='23' text-anchor='middle' font-family='Georgia,serif' font-size='20' font-weight='bold' fill='white'>P</text></svg>"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#eef2f9;color:#101828;min-height:100vh;display:flex;flex-direction:column;}
a{color:#2563eb;text-decoration:none;}
nav{height:64px;background:#fff;border-bottom:1px solid #eaecf0;display:flex;align-items:center;justify-content:space-between;padding:0 48px;}
.logo{font-size:1.75rem;font-weight:800;letter-spacing:-0.03em;color:#101828;display:flex;align-items:center;gap:0;}
.logo span{color:#2563eb;}
.logo img{width:42px;height:42px;border-radius:11px;}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;}
.card{background:#fff;border:1px solid #eaecf0;border-radius:16px;padding:36px;max-width:420px;width:100%;box-shadow:0 4px 24px rgba(16,24,40,0.06);}
h1{font-size:1.5rem;font-weight:800;margin-bottom:6px;}
.sub{font-size:0.85rem;color:#667085;margin-bottom:24px;}
label{font-size:0.8rem;font-weight:700;margin-bottom:6px;display:block;}
input{width:100%;padding:12px 14px;border-radius:9px;border:1.5px solid #d0d5dd;font-size:0.9rem;font-family:inherit;margin-bottom:16px;}
input:focus{outline:none;border-color:#2563eb;}
.btn{width:100%;padding:13px;background:#2563eb;color:#fff;border:none;border-radius:9px;font-family:'Plus Jakarta Sans',sans-serif;font-size:0.9rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn:hover{background:#1d4ed8;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}
.status{margin-top:14px;font-size:0.8rem;text-align:center;}
.status.err{color:#b42318;}
.status.ok{color:#027a48;}
.foot-link{text-align:center;font-size:0.82rem;color:#667085;margin-top:18px;}
.foot-link a{color:#2563eb;font-weight:700;}
.row-between{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
</style>
</head>
<body>
<nav>
  <a href="/" class="logo"><img src="/images/logo.png" alt="PlagiFix logo"/>Plagi<span>Fix</span></a>
</nav>

<main>
  <div class="card">
    <h1>Welcome back</h1>
    <p class="sub">Sign in to your PlagiFix account.</p>

    <div id="pay-notice" style="display:none;background:#eff6ff;border:1px solid #bfdbfe;border-radius:9px;padding:12px 14px;margin-bottom:18px;font-size:0.8rem;color:#1e40af;">
      ✓ Payment received! Sign in or create an account below to activate your credits.
    </div>

    <form id="login-form">
      <label>Email</label>
      <input type="email" id="email" required/>

      <div class="row-between">
        <label style="margin-bottom:0;">Password</label>
        <a href="/forgot-password.html" style="font-size:0.75rem;">Forgot password?</a>
      </div>
      <input type="password" id="password" required/>

      <button type="submit" class="btn" id="submit-btn">Sign in →</button>
      <div class="status" id="status"></div>
    </form>

    <div class="foot-link">Don't have an account? <a href="/register.html">Register free</a></div>
  </div>
</main>

<script>
const BACKEND = 'https://file-processor-production-8962.up.railway.app';
const SUPABASE_URL = 'https://wrypnctfcwijglyivthg.supabase.co';
const SUPABASE_KEY = 'sb_publishable_I7NR_6S40Ydjyw44Ic26pw_I5-XUrTr';

const params = new URLSearchParams(window.location.search);
const paymentId = params.get('payment_id');
const plan = params.get('plan');

if (paymentId) {
  document.getElementById('pay-notice').style.display = 'block';
}

const form = document.getElementById('login-form');
const submitBtn = document.getElementById('submit-btn');
const statusEl = document.getElementById('status');

function getOrCreateDeviceId() {
  let deviceId = localStorage.getItem('pf_device_id');
  if (!deviceId) {
    deviceId = 'dev_' + Date.now() + '_' + Math.random().toString(36).substring(2, 15);
    localStorage.setItem('pf_device_id', deviceId);
  }
  return deviceId;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  submitBtn.disabled = true;
  submitBtn.innerHTML = '<span class="spin"></span> Signing in...';
  statusEl.textContent = '';
  statusEl.className = 'status';

  const email = document.getElementById('email').value.trim().toLowerCase();
  const password = document.getElementById('password').value;

  try {
    const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ email, password })
    });
    const data = await r.json();

    if (!r.ok || data.error || !data.access_token) throw new Error(data.error_description || data.msg || 'Invalid email or password.');

    localStorage.setItem('pf_token', data.access_token);
    localStorage.setItem('pf_email', data.user.email);
    localStorage.setItem('pf_name', data.user.user_metadata?.full_name || data.user.email);

    if (paymentId && plan) {
      try {
        await fetch(`https://file-processor-production-8962.up.railway.app/confirm-payment`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ email: data.user.email, payment_id: paymentId, plan })
        });
      } catch (err) { }
    }

    let redirectMsg = '✓ Signed in! Redirecting...';

    try {
      const deviceId = getOrCreateDeviceId();
      const freeCreditRes = await fetch(`${BACKEND}/free-credit`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ email: data.user.email, device_id: deviceId })
      });
      if (freeCreditRes.status === 403) {
        redirectMsg = '✓ Signed in! You\'ve already claimed a free credit on this device — please purchase a plan to continue. Redirecting...';
      }
    } catch (err) { }

    statusEl.textContent = redirectMsg;
    statusEl.className = 'status ok';

    setTimeout(() => {
      window.location.href = '/dashboard.html';
    }, 1800);

  } catch (err) {
    statusEl.textContent = err.message || 'Something went wrong. Please try again.';
    statusEl.className = 'status err';
    submitBtn.disabled = false;
    submitBtn.innerHTML = 'Sign in →';
  }
});
</script>
</body>
</html>
